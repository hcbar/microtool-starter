name: Codex bridge — DRY_RUN only
run-name: dry-run-${{ github.event.issue.number }}-${{ github.event.comment.body }}
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
  actions: read
concurrency:
  group: codex-dry-run-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  dry-run:
    if: >-
      github.repository == 'hcbar/microtool-starter' &&
      github.event.issue.number == 4 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/codex')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.0'
      - name: Authenticate, validate scope and reject duplicates; never execute Codex
        run: node scripts/codex-dry-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
